name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: string

jobs:
  deploy:
    name: SSH deploy CareTracker backend
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 12m
          envs: DEPLOY_BRANCH,EXPO_ACCESS_TOKEN
          script: |
            set -e
            BRANCH="${DEPLOY_BRANCH:-main}"
            echo "Deploying backend branch: ${BRANCH}"
            cd /var/www/CareTracker-backend/
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            node -e 'const fs=require("fs");const p="config/.env";const t=String(process.env.EXPO_ACCESS_TOKEN||"").trim();if(!t){console.log("EXPO_ACCESS_TOKEN secret is empty");process.exit(0);}fs.mkdirSync("config",{recursive:true});const text=fs.existsSync(p)?fs.readFileSync(p,"utf8"):"";const lines=text.split(/\r?\n/);let found=false;const out=lines.map((l)=>{if(l.startsWith("EXPO_ACCESS_TOKEN=")){found=true;return "EXPO_ACCESS_TOKEN="+t;}return l;});if(!found){if(out.length&&out[out.length-1]!=="")out.push("");out.push("EXPO_ACCESS_TOKEN="+t);}fs.writeFileSync(p,out.join("\n").replace(/\n+$/,"\n"));console.log("EXPO_ACCESS_TOKEN synced into config/.env");'
            npm install --omit=dev
            pm2 restart all
