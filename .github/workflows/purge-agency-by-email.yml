name: Purge agency by email

on:
  workflow_dispatch:
    inputs:
      email:
        description: Agency owner email to hard-delete
        required: true
        type: string

jobs:
  purge:
    name: SSH purge agency
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    steps:
      - name: Purge over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_EMAIL: ${{ inputs.email }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: TARGET_EMAIL
          script: |
            set -e
            EMAIL="$(echo "${TARGET_EMAIL}" | tr '[:upper:]' '[:lower:]' | xargs)"
            echo "Purging agency for email: ${EMAIL}"
            cd /var/www/CareTracker-backend/

            # Prefer repo script if present; otherwise inline Node purge
            if [ -f scripts/purgeAgencyByEmail.js ]; then
              node scripts/purgeAgencyByEmail.js "${EMAIL}"
            else
              node <<'NODE'
            require('dotenv').config({ path: 'config/.env' });
            const mongoose = require('mongoose');
            const Model = require('./models/index');
            const { purgeAgencyRelatedData } = require('./services/admin/agencyPurge.service');
            const email = String(process.env.TARGET_EMAIL || '').trim().toLowerCase();
            (async () => {
              await mongoose.connect(process.env.MONGODB_URI);
              const agencies = await Model.AgencyModel.find({
                email: new RegExp('^' + email.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i'),
              }).select('_id name email');
              const accounts = await Model.AgencyAccountModel.find({
                $or: [{ email }, { userId: email }],
              }).select('_id agencyId email role');
              const ids = [...new Set([
                ...agencies.map((a) => String(a._id)),
                ...accounts.map((a) => (a.agencyId ? String(a.agencyId) : '')).filter(Boolean),
              ])];
              console.log('agencies', agencies.map((a) => ({ id: String(a._id), name: a.name, email: a.email })));
              console.log('accounts', accounts.map((a) => ({ id: String(a._id), email: a.email, agencyId: a.agencyId ? String(a.agencyId) : null, role: a.role })));
              for (const id of ids) {
                const agency = await Model.AgencyModel.findById(id);
                if (!agency) continue;
                console.log('purging', String(agency._id), agency.name);
                console.log(await purgeAgencyRelatedData(agency._id));
                await Model.AgencyModel.findByIdAndDelete(agency._id);
              }
              console.log('orphan accounts', (await Model.AgencyAccountModel.deleteMany({ $or: [{ email }, { userId: email }] })).deletedCount);
              console.log('invites', (await Model.InvitationModel.deleteMany({ email })).deletedCount);
              await mongoose.disconnect();
              console.log('Done');
            })().catch(async (e) => { console.error(e); try { await mongoose.disconnect(); } catch {} process.exit(1); });
            NODE
            fi
